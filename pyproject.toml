[project]
name = "intent-anchor"
version = "0.1.0"
description = "Goal-state as a first-class citizen: mechanical intent anchoring for long-horizon agents (proof of concept)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nuyuk25721" }]
dependencies = []
keywords = ["agent", "harness", "long-horizon", "intent-drift", "llm"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goal_harness"]
